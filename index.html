<!-- myMONO v1 // MONO-HALFTONE витягнуто з myFIX v2 // DET: MediaPipe ObjectDetector + SEG: ImageSegmenter (DeepLab v3) + DEP: Depth Anything V2 Small (transformers.js, worker) + OCR: Tesseract.js eng+ukr // нейронки їдять чистий grayscale ДО халфтону // single-file, CDN-only, mobile-first -->
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --ink: #14110b;
    --paper: #eceae2;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
}
html, body { overscroll-behavior: none; height: 100%; }
body {
    margin: 0; background: var(--paper); overflow: hidden;
    font-family: var(--mono); user-select: none; -webkit-user-select: none; cursor: crosshair;
}
#container { position: relative; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }

/* Відео — texture source для шейдера; при живому WebGL ховається */
video {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: opacity 0.4s;
}
video.rawfallback { filter: grayscale(1) contrast(1.2) brightness(1.05); }
#glCanvas  { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; background: var(--paper); }
#hudCanvas { position: absolute; inset: 0; z-index: 6; width: 100%; height: 100%; pointer-events: none; }

#scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(38,34,24,0.07) 3px, rgba(38,34,24,0.07) 4px);
    animation: scanScroll 8s linear infinite;
}
@keyframes scanScroll { from{background-position:0 0} to{background-position:0 100px} }

#vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0.3;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.8) 100%);
}

/* BOTTOM BAR: тільки кнопки модулів */
#botbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(236,234,226,0.9), transparent);
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    z-index: 16; border-top: 1px solid rgba(38,34,24,0.2);
}
.hudBtn {
    background: rgba(236,234,226,0.6); border: 1px solid rgba(38,34,24,0.4);
    color: rgba(38,34,24,0.85); font-family: var(--sans);
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    padding: 8px 10px; cursor: pointer; text-transform: uppercase;
    touch-action: manipulation; flex-shrink: 0; min-width: 52px;
}
.hudBtn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hudBtn.off { opacity: 0.35; text-decoration: line-through; }
.hudBtn:disabled { opacity: 0.2; }
#scnBtn { border-style: dashed; }

/* TOAST: один рядок суржик-статусу над баром */
#toast {
    position: absolute; bottom: calc(58px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    max-width: 92vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: rgba(38,34,24,0.85);
    background: rgba(236,234,226,0.9); border: 1px solid rgba(38,34,24,0.3);
    padding: 5px 12px; z-index: 15; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
}
#toast.show { opacity: 1; }
#toast.warn { border-color: var(--ink); font-weight: 700; }

/* PiP: дизерена міні-мапа глибини, тап — розгорнути */
#pip {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px;
    width: 120px; z-index: 14; display: none;
    border: 1px solid rgba(38,34,24,0.55);
    background: var(--paper);
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: pointer; touch-action: manipulation;
    transition: width 0.25s;
}
#pip.shown { display: block; }
#pip.big { width: 62vw; }

/* START: чорнильне кільце на папері */
#startBtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: none; border: none; color: var(--ink);
    font-family: var(--sans); font-size: 11px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase;
    cursor: pointer; z-index: 20; outline: none; padding: 0;
}
#startBtn .btn-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }
#startBtn .btn-ring  { width: 80px; height: 80px; position: relative; display: flex; align-items: center; justify-content: center; }
.ring-svg  { position: absolute; inset: 0;   animation: spinRing 4s linear infinite; }
.ring-svg2 { position: absolute; inset: 6px; animation: spinRing 7s linear infinite reverse; }
@keyframes spinRing { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
#startBtn .btn-text { letter-spacing: 6px; opacity: 0.75; }
#startBtn:hover .btn-text { opacity: 1; }
#startBtn:hover .ring-svg  { animation-duration: 1.5s; }
</style>
</head>
<body>

<script type="module">
import { FilesetResolver, ObjectDetector, ImageSegmenter } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

/*__PURE_BEGIN__*/
/* ── Чиста логіка: без DOM, тестується headless ── */

/* object-fit:cover мапінг: відео-пікселі -> екранні css-пікселі (з myFIX, дослівно) */
function coverTransform(vw, vh, sw, sh){
    const scale = Math.max(sw / vw, sh / vh);
    return { scale, ox: (sw - vw * scale) / 2, oy: (sh - vh * scale) / 2 };
}
function v2s(x, y, T){
    let sx = x * T.scale + T.ox, sy = y * T.scale + T.oy;
    if (T.zoom && T.zoom !== 1){
        sx = (sx - T.zcx) * T.zoom + T.zcx;
        sy = (sy - T.zcy) * T.zoom + T.zcy;
    }
    return { x: sx, y: sy };
}

function iou(a, b){
    const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
    const x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
    const iw = Math.max(0, x2 - x1), ih = Math.max(0, y2 - y1);
    const inter = iw * ih;
    const uni = a.w * a.h + b.w * b.h - inter;
    return uni > 0 ? inter / uni : 0;
}
function lerpBox(a, b, k){
    return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, w: a.w + (b.w - a.w) * k, h: a.h + (b.h - a.h) * k };
}

let __uid = 0;
function nextUid(){ __uid = (__uid + 1) % 4096; return '0x' + __uid.toString(16).toUpperCase().padStart(3, '0'); }

/* IoU-трекер: стабільні ID, згладжування боксів, голосування класу (з myFIX, дослівно) */
function updateTracks(tracks, dets, now, opts){
    const o = opts || {};
    const iouThr  = o.iouThr  !== undefined ? o.iouThr  : 0.3;
    const ttl     = o.ttl     !== undefined ? o.ttl     : 700;
    const smooth  = o.smooth  !== undefined ? o.smooth  : 0.4;
    const unmatched = new Set(dets.map((_, i) => i));
    const order = tracks.slice().sort((a, b) => b.hits - a.hits);
    for (const t of order){
        let best = -1, bestV = iouThr;
        for (const i of unmatched){
            const v = iou(t.box, dets[i].box);
            if (v > bestV){ bestV = v; best = i; }
        }
        if (best >= 0){
            const d = dets[best];
            unmatched.delete(best);
            t.box = lerpBox(t.box, d.box, smooth);
            t.score = t.score * (1 - smooth) + d.score * smooth;
            t.votes[d.cls] = (t.votes[d.cls] || 0) + 1;
            if (d.cls !== t.cls && t.votes[d.cls] > (t.votes[t.cls] || 0)) t.cls = d.cls;
            t.seen = now; t.hits++;
        }
    }
    for (const i of unmatched){
        const d = dets[i];
        tracks.push({
            id: nextUid(),
            box: { x: d.box.x, y: d.box.y, w: d.box.w, h: d.box.h },
            cls: d.cls, score: d.score,
            votes: { [d.cls]: 1 },
            born: now, seen: now, hits: 1
        });
    }
    return tracks.filter(t => now - t.seen < ttl);
}

/* Планувальник слотів: одна найпрострочніша модель за тік.
   mods: [{key, on, busy, last, interval}] -> key або null */
function nextSlot(now, mods){
    let best = null, bestR = 1;
    for (const m of mods){
        if (!m.on || m.busy) continue;
        const r = (now - m.last) / m.interval;
        if (r >= 1 && r > bestR){ bestR = r; best = m.key; }
    }
    return best;
}

/* Медіана глибини всередині боксу. depth: Uint8 (dw x dh), box у відео-пікселях.
   Повертає 0..255 або -1, якщо бокс поза мапою. */
function medianDepthInBox(depth, dw, dh, box, vw, vh){
    const sx = dw / vw, sy = dh / vh;
    const x0 = Math.max(0, Math.floor(box.x * sx)), y0 = Math.max(0, Math.floor(box.y * sy));
    const x1 = Math.min(dw - 1, Math.ceil((box.x + box.w) * sx));
    const y1 = Math.min(dh - 1, Math.ceil((box.y + box.h) * sy));
    if (x1 <= x0 || y1 <= y0) return -1;
    const gs = Math.max(1, Math.floor(Math.max(x1 - x0, y1 - y0) / 14));
    const vals = [];
    for (let y = y0; y <= y1; y += gs)
        for (let x = x0; x <= x1; x += gs) vals.push(depth[y * dw + x]);
    if (!vals.length) return -1;
    vals.sort((a, b) => a - b);
    return vals[vals.length >> 1];
}
/* Depth Anything: 255 = близько. RANGE·REL: 0 близько .. 99 далеко. НЕ метри. */
function depthToRange(v){
    if (v < 0) return -1;
    return Math.max(0, Math.min(99, Math.round((1 - v / 255) * 99)));
}

/* Частка семплів боксу, накритих SEG-маскою (клас > 0) */
function segCoverage(mask, mw, mh, box, vw, vh){
    const sx = mw / vw, sy = mh / vh, G = 10;
    let n = 0, hit = 0;
    for (let iy = 0; iy < G; iy++)
        for (let ix = 0; ix < G; ix++){
            const x = Math.floor((box.x + box.w * (ix + 0.5) / G) * sx);
            const y = Math.floor((box.y + box.h * (iy + 0.5) / G) * sy);
            if (x < 0 || y < 0 || x >= mw || y >= mh) continue;
            n++;
            if (mask[y * mw + x] > 0) hit++;
        }
    return n ? hit / n : 0;
}

/* OCR-геометрія */
function scaleWords(words, k){
    return words.map(w => ({ text: w.text, conf: w.conf, x: w.x * k, y: w.y * k, w: w.w * k, h: w.h * k }));
}
/* Групування слів у рядки: близькі по центру y, всередині рядка сортовані по x */
function groupLines(words, yTol){
    const tol = yTol === undefined ? 0.6 : yTol;
    const ws = words.slice().sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2));
    const lines = [];
    for (const w of ws){
        const cy = w.y + w.h / 2;
        let ln = null;
        for (const L of lines){
            if (Math.abs(cy - L.cy) < tol * Math.max(w.h, L.h)){ ln = L; break; }
        }
        if (!ln){ ln = { words: [], cy: cy, h: w.h }; lines.push(ln); }
        ln.words.push(w);
        ln.cy = (ln.cy * (ln.words.length - 1) + cy) / ln.words.length;
        ln.h = Math.max(ln.h, w.h);
    }
    return lines.map(L => {
        L.words.sort((a, b) => a.x - b.x);
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, cs = 0;
        for (const w of L.words){
            x0 = Math.min(x0, w.x); y0 = Math.min(y0, w.y);
            x1 = Math.max(x1, w.x + w.w); y1 = Math.max(y1, w.y + w.h);
            cs += w.conf;
        }
        return {
            text: L.words.map(w => w.text).join(' '),
            conf: cs / L.words.length,
            x: x0, y: y0, w: x1 - x0, h: y1 - y0
        };
    });
}
/* Прив'язка рядків до треків: центр рядка в боксі -> найменший бокс, що містить.
   Повертає { assigned: [[trackId, text]], free: [line] } */
function attachText(tracks, lines){
    const assigned = [], free = [];
    for (const L of lines){
        const cx = L.x + L.w / 2, cy = L.y + L.h / 2;
        let hit = null;
        for (const t of tracks){
            const b = t.box;
            if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h){
                if (!hit || b.w * b.h < hit.box.w * hit.box.h) hit = t;
            }
        }
        if (hit) assigned.push([hit.id, L.text]);
        else free.push(L);
    }
    return { assigned: assigned, free: free };
}

/* Байєр 4x4 для PiP-дизерингу */
const BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function bayer4(x, y){ return (BAYER4[y & 3][x & 3] + 0.5) / 16; }

/* Санітар OCR: пробіли, мінімум 2 буквено-цифрові символи (лат/укр) */
function cleanText(s){
    const t = String(s).replace(/\s+/g, ' ').trim();
    return /[A-Za-zА-Яа-яЄєІіЇїҐґ0-9]{2,}/.test(t) ? t : '';
}
/*__PURE_END__*/

/* ── Конфіг ── */
const CFG = {
    detMs: 66, segMs: 200, depMs: 700, ocrMs: 3000,
    trackTTL: 700, iouThr: 0.3, smooth: 0.4,
    glMaxDpr: 1.5, hudMaxDpr: 2,
    nnW: 640, ocrConf: 60, tickGap: 600,
    maskTTL: 1200, depTTL: 4000, textTTL: 10000, freeTTL: 8000
};
const WASM_URL  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL_OBJ = 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite';
const MODEL_SEG = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite';
const INK = '20,18,13';
const PAPER = '236,234,226';

/* ── DOM ── */
const $ = id => document.getElementById(id);
const container = $('container'), video = $('video');
const canvas = $('hudCanvas'), glCanvas = $('glCanvas');
const ctx = canvas.getContext('2d');
const startBtn = $('startBtn'), botbar = $('botbar'), toastEl = $('toast'), pip = $('pip');
const pipCx = pip.getContext('2d');
const scnBtn = $('scnBtn'), sndBtn = $('sndBtn');

/* ── Стан ── */
const ST = {
    running: false, booting: false,
    tracks: [],
    mask: null,      /* { data:Uint8Array, w, h, at } */
    depth: null,     /* { data:Uint8Array, w, h, at } */
    ocrFree: null,   /* { lines:[], at } */
    wake: null, lastTick: 0, scanning: false
};
let objDet = null, segDet = null, ocrWorker = null, depWorker = null;
let hudDpr = 1, lastFrame = performance.now(), lastGl = 0;

function coverT(){
    return coverTransform(video.videoWidth || 640, video.videoHeight || 480, innerWidth, innerHeight);
}
function resize(){
    hudDpr = Math.min(devicePixelRatio || 1, CFG.hudMaxDpr);
    canvas.width  = Math.round(innerWidth * hudDpr);
    canvas.height = Math.round(innerHeight * hudDpr);
}

/* ── АУДІО: мінімум — принтерний бут + чорнильний тік нової цілі (ядро з myFIX) ── */
const AU = {
    ctx: null, master: null, on: true, noise: null,
    init(){
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.6;
            this.master.connect(this.ctx.destination);
            const len = this.ctx.sampleRate;
            const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
            this.noise = buf;
            this.ctx.resume();
        } catch (e) { this.ctx = null; }
    },
    now(){ return this.ctx.currentTime; },
    env(g, t0, a, peak, d){
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(peak, t0 + a);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    },
    osc(type, f0, f1, t0, dur, peak){
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(Math.max(1, f0), t0);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
        this.env(g, t0, 0.005, peak, dur);
        o.connect(g); g.connect(this.master);
        o.start(t0); o.stop(t0 + dur + 0.1);
    },
    nz(t0, dur, peak, fType, f0, f1, q){
        if (!this.ctx) return;
        const s = this.ctx.createBufferSource(); s.buffer = this.noise; s.loop = true;
        const f = this.ctx.createBiquadFilter(); f.type = fType;
        f.frequency.setValueAtTime(Math.max(10, f0), t0);
        if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(10, f1), t0 + dur);
        f.Q.value = q || 1;
        const g = this.ctx.createGain();
        this.env(g, t0, 0.008, peak, dur);
        s.connect(f); f.connect(g); g.connect(this.master);
        s.start(t0); s.stop(t0 + dur + 0.1);
    },
    monoSwap(){
        /* матричний принтер: черга тіків + дзвіночок каретки (з myFIX, дослівно) */
        if (!this.ctx) return; const t = this.now();
        for (let i = 0; i < 9; i++) this.osc('square', 2400 - i * 90, 2400 - i * 90, t + i * 0.045, 0.02, 0.04);
        this.osc('sine', 1568, 1568, t + 0.48, 0.25, 0.06);
    },
    inkTick(){
        if (!this.ctx) return; const t = this.now();
        this.osc('square', 1900, 1900, t, 0.02, 0.04);
        this.osc('square', 1300, 1300, t + 0.09, 0.03, 0.035);
    },
    setMute(m){ if (!this.ctx) return; this.on = !m; this.master.gain.setTargetAtTime(m ? 0 : 0.6, this.now(), 0.05); }
};

/* ── Тост: один рядок статусу ── */
let toastT = null;
function toast(msg, warn){
    toastEl.textContent = msg;
    toastEl.classList.toggle('warn', !!warn);
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* ── WebGL: тільки MONO — газетний halftone під 45 + Sobel-контури (гілка з myFIX, дослівно) ── */
const FRAG = `
precision mediump float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uUVScale;
uniform vec2 uUVOff;
uniform vec2 uRes;
uniform float uPx;
uniform float uSob;

vec2 suv(vec2 s){ return s * uUVScale + uUVOff; }
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

void main(){
    mat2 Rf = mat2(0.7071, 0.7071, -0.7071, 0.7071);
    mat2 Ri = mat2(0.7071, -0.7071, 0.7071, 0.7071);
    vec2 pr = Rf * gl_FragCoord.xy;
    vec2 cM = floor(pr / uPx);
    vec2 ctr = Ri * ((cM + 0.5) * uPx);
    float lq = lum(texture2D(uTex, suv(ctr / uRes)).rgb);
    lq = clamp((lq - 0.5) * 1.25 + 0.56, 0.0, 1.0);
    float dk = 1.0 - lq;
    vec2 fM = pr / uPx - (cM + 0.5);
    float dotInk = step(length(fM), sqrt(dk) * 0.72);
    vec2 e = vec2(uSob) / uRes;
    float gx = lum(texture2D(uTex, suv(vUV + vec2(e.x, 0.0))).rgb) - lum(texture2D(uTex, suv(vUV - vec2(e.x, 0.0))).rgb);
    float gy = lum(texture2D(uTex, suv(vUV + vec2(0.0, e.y))).rgb) - lum(texture2D(uTex, suv(vUV - vec2(0.0, e.y))).rgb);
    float edge = smoothstep(0.13, 0.32, length(vec2(gx, gy)));
    float ink = max(dotInk, edge);
    vec3 col = mix(vec3(0.93, 0.92, 0.88), vec3(0.20, 0.18, 0.13), ink);
    float d = length(vUV - vec2(0.5, 0.5));
    float vig = smoothstep(0.95, 0.35, d) * 0.35 + 0.65;
    col *= mix(vig, 1.0, 0.7);
    gl_FragColor = vec4(col, 1.0);
}
`;

const GL = {
    gl: null, uni: null, ok: false, cv: null,
    init(cv){
        this.cv = cv;
        const gl = cv.getContext('webgl', { antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
        if (!gl) return false;
        const mk = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); return null; }
            return s;
        };
        const vs = mk(gl.VERTEX_SHADER, 'attribute vec2 aPos; varying vec2 vUV; void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }');
        const fs = mk(gl.FRAGMENT_SHADER, FRAG);
        if (!vs || !fs) return false;
        const pr = gl.createProgram();
        gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
        if (!gl.getProgramParameter(pr, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(pr)); return false; }
        gl.useProgram(pr);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(pr, 'aPos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        const U = n => gl.getUniformLocation(pr, n);
        this.uni = { uUVScale: U('uUVScale'), uUVOff: U('uUVOff'), uRes: U('uRes'), uPx: U('uPx'), uSob: U('uSob') };
        gl.uniform1i(U('uTex'), 0);
        this.gl = gl; this.ok = true;
        cv.addEventListener('webglcontextlost', () => { this.ok = false; }, false);
        return true;
    },
    render(now){
        if (!this.ok || video.readyState < 2) return;
        const gl = this.gl, cv = this.cv;
        const dpr = Math.min(devicePixelRatio || 1, CFG.glMaxDpr);
        const W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
        if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; gl.viewport(0, 0, W, H); }
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
        const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
        const va = vw / vh, ca = innerWidth / innerHeight;
        let sx = 1, sy = 1, ox = 0, oy = 0;
        if (va > ca){ sx = ca / va; ox = (1 - sx) / 2; }
        else        { sy = va / ca; oy = (1 - sy) / 2; }
        gl.uniform2f(this.uni.uUVScale, sx, sy);
        gl.uniform2f(this.uni.uUVOff, ox, oy);
        gl.uniform2f(this.uni.uRes, W, H);
        gl.uniform1f(this.uni.uPx, Math.max(4, Math.round(3 * dpr)));
        gl.uniform1f(this.uni.uSob, Math.max(2, Math.round(1.5 * dpr)));
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
};

/* ── Сірий тап для нейронок: luma ДО халфтону, коефіцієнти = шейдерним (0.299/0.587/0.114) ── */
const loCv = document.createElement('canvas');
const loCx = loCv.getContext('2d', { willReadFrequently: true });
const hiCv = document.createElement('canvas');
const hiCx = hiCv.getContext('2d', { willReadFrequently: true });
let loStamp = -1, loCache = null;

function toGray(d){
    for (let i = 0; i < d.length; i += 4){
        const g = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
        d[i] = g; d[i + 1] = g; d[i + 2] = g;
    }
}
function grayLo(stamp){
    if (loStamp === stamp && loCache) return loCache;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const w = Math.min(CFG.nnW, vw), h = Math.round(w * vh / vw);
    if (loCv.width !== w || loCv.height !== h){ loCv.width = w; loCv.height = h; }
    loCx.drawImage(video, 0, 0, w, h);
    const id = loCx.getImageData(0, 0, w, h);
    toGray(id.data);
    loCx.putImageData(id, 0, 0);
    loStamp = stamp;
    loCache = { cv: loCv, id: id, w: w, h: h };
    return loCache;
}
function grayHi(){
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    if (hiCv.width !== vw || hiCv.height !== vh){ hiCv.width = vw; hiCv.height = vh; }
    hiCx.drawImage(video, 0, 0, vw, vh);
    const id = hiCx.getImageData(0, 0, vw, vh);
    toGray(id.data);
    return { id: id, w: vw, h: vh };
}

/* ── DEP: Depth Anything V2 Small у module-воркері, щоб WASM не душив рендер ── */
const DEP_WORKER_SRC = [
"const CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';",
"let pipe = null, RawImageC = null;",
"async function boot(pref){",
"    const M = await import(CDN);",
"    M.env.allowLocalModels = false;",
"    RawImageC = M.RawImage;",
"    const tries = pref === 'webgpu'",
"        ? [['webgpu', 'fp16'], ['wasm', 'q8'], ['wasm', 'fp32']]",
"        : [['wasm', 'q8'], ['wasm', 'fp32']];",
"    let last = null;",
"    for (const t of tries){",
"        try {",
"            pipe = await M.pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', {",
"                device: t[0], dtype: t[1],",
"                progress_callback: function(p){",
"                    if (p && p.status === 'progress' && p.file && p.file.indexOf('.onnx') >= 0)",
"                        postMessage({ type: 'prog', p: p.progress || 0 });",
"                }",
"            });",
"            return t[0];",
"        } catch (e){ last = e; pipe = null; }",
"    }",
"    throw last;",
"}",
"self.onmessage = async function(e){",
"    const m = e.data;",
"    if (m.type === 'init'){",
"        try { const dev = await boot(m.device); postMessage({ type: 'ready', device: dev }); }",
"        catch (err){ postMessage({ type: 'err', msg: String(err && err.message || err) }); }",
"    } else if (m.type === 'frame'){",
"        if (!pipe){ postMessage({ type: 'skip' }); return; }",
"        try {",
"            const img = new RawImageC(new Uint8ClampedArray(m.buf), m.w, m.h, 4);",
"            const out = await pipe(img);",
"            const d = out.depth;",
"            const u8 = (d.data instanceof Uint8Array || d.data instanceof Uint8ClampedArray) ? new Uint8Array(d.data) : Uint8Array.from(d.data);",
"            postMessage({ type: 'depth', buf: u8.buffer, w: d.width, h: d.height }, [u8.buffer]);",
"        } catch (err){ postMessage({ type: 'err', msg: String(err && err.message || err) }); }",
"    }",
"};"
].join('\n');

/* ── Модулі: тогли, ліниве завантаження, прогрес на кнопці ── */

};

let visionFS = null;

    if (!visionFS) visionFS = FilesetResolver.forVisionTasks(WASM_URL);

/* GPU з чесним фолбеком на CPU (з myFIX) */
async function mkDet(Cls, opts, label, vision){
    try {
        return await Cls.createFromOptions(vision, Object.assign({}, opts, { baseOptions: Object.assign({}, opts.baseOptions, { delegate: 'GPU' }) }));
    } catch (e) {
        toast(label + ': GPU КАПРИЗУЄ, ЇДУ НА CPU', true);
        return await Cls.createFromOptions(vision, Object.assign({}, opts, { baseOptions: Object.assign({}, opts.baseOptions, { delegate: 'CPU' }) }));
    }
}
function tsFor(o){ o._ts = Math.max((o._ts || 0) + 1, performance.now()); return o._ts; }

const LOADERS = {
    async DET(){
        const vision = await ensureVision();
        objDet = await mkDet(ObjectDetector, { runningMode: 'VIDEO', scoreThreshold: 0.4, maxResults: 10, baseOptions: { modelAssetPath: MODEL_OBJ } }, 'ДЕТЕКТОР', vision);
        toast('ДЕТЕКТОР ПІДЇХАВ. ЛОВИМО');
    },
    async SEG(){

    },
    DEP(){
        return new Promise((res, rej) => {
            const blob = new Blob([DEP_WORKER_SRC], { type: 'text/javascript' });
            depWorker = new Worker(URL.createObjectURL(blob), { type: 'module' });
            depWorker.onmessage = ev => {
                const m = ev.data;
                if (m.type === 'prog'){ setBtn('DEP', 'load', Math.round(m.p > 1 ? m.p : m.p * 100)); }
                else if (m.type === 'ready'){
                    toast(m.device === 'webgpu' ? 'ГЛИБИНА НА WEBGPU. ЛІТАЄ' : 'ГЛИБИНА НА WASM. ПОВЗЕ, АЛЕ ПАШЕ');
                    depWorker.onmessage = onDepMsg;
                    res();
                }
                else if (m.type === 'err'){ rej(new Error(m.msg)); }
            };
            depWorker.onerror = e => rej(new Error(e.message || 'worker'));
            depWorker.postMessage({ type: 'init', device: navigator.gpu ? 'webgpu' : 'wasm' });
        });
    },
    async OCR(){
        const mod = await import('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js');
        const Tess = mod.default || mod;
        ocrWorker = await Tess.createWorker(['eng', 'ukr'], 1, {
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
            corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5',
            logger: m => { if (m && m.progress !== undefined && m.status === 'loading language traineddata') setBtn('OCR', 'load', Math.round(m.progress * 100)); }
        });

};
const FAIL_MSG = { DET: 'ДЕТЕКТОР НЕ ПІДЇХАВ', SEG: 'МАСКИ НЕ ЗАВЕЛИСЬ', DEP: 'ГЛИБИНА ВПАЛА', OCR: 'ЧИТАЛКА НЕ ВСТАЛА' };

async function toggleMod(key){
    if (!ST.running) return;

/* ── Інжести ── */
let lastPingAt = 0;
function ingestDet(res, now, kv){
    const dets = ((res && res.detections) || []).map(d => ({
        box: { x: d.boundingBox.originX * kv, y: d.boundingBox.originY * kv, w: d.boundingBox.width * kv, h: d.boundingBox.height * kv },
        cls: ((d.categories[0] && d.categories[0].categoryName) || '?').toLowerCase(),
        score: (d.categories[0] && d.categories[0].score) || 0
    }));
    ST.tracks = updateTracks(ST.tracks, dets, now, { iouThr: CFG.iouThr, ttl: CFG.trackTTL, smooth: CFG.smooth });
    for (const t of ST.tracks){
        if (t.hits === 2 && !t.pinged){
            t.pinged = true;
            if (now - lastPingAt > CFG.tickGap){ lastPingAt = now; AU.inkTick(); }
        }
    }
}

const maskCv = document.createElement('canvas');
const maskCx = maskCv.getContext('2d');
function ingestSeg(res, now, g){
    if (!res || !res.categoryMask) return;
    const m = res.categoryMask;
    const mw = m.width || g.w, mh = m.height || g.h;
    let arr = null;
    try { arr = m.getAsUint8Array(); } catch (e) {}
    try { m.close(); } catch (e) {}
    if (!arr) return;
    ST.mask = { data: new Uint8Array(arr), w: mw, h: mh, at: now };
    if (maskCv.width !== mw || maskCv.height !== mh){ maskCv.width = mw; maskCv.height = mh; }
    const id = maskCx.createImageData(mw, mh);
    const d = id.data, src = ST.mask.data;
    for (let y = 0; y < mh; y++){
        const row = y * mw;
        for (let x = 0; x < mw; x++){
            if (src[row + x] > 0 && ((x + y) % 6) < 2){
                const i = (row + x) * 4;
                d[i] = 20; d[i + 1] = 18; d[i + 2] = 13; d[i + 3] = 135;
            }
        }
    }
    maskCx.putImageData(id, 0, 0);
}

function onDepMsg(ev){
    const m = ev.data;
    if (m.type === 'depth'){
        ST.depth = { data: new Uint8Array(m.buf), w: m.w, h: m.h, at: performance.now() };
        buildPip();
        MODS.DEP.busy = false;
    } else if (m.type === 'err'){
        toast('ГЛИБИНА СПІТКНУЛАСЬ', true);
        MODS.DEP.busy = false;
    } else if (m.type === 'skip'){
        MODS.DEP.busy = false;
    }
}

/* PiP: Байєр-дизер по мапі глибини, чорнило = близько */
function buildPip(){
    const D = ST.depth;
    if (!D || !MODS.DEP.on) return;
    const step = Math.max(1, Math.ceil(D.w / 160));
    const w = Math.floor(D.w / step), h = Math.floor(D.h / step);
    if (pip.width !== w || pip.height !== h){ pip.width = w; pip.height = h; }
    const id = pipCx.createImageData(w, h);
    const d = id.data;
    for (let y = 0; y < h; y++){
        for (let x = 0; x < w; x++){
            const v = D.data[(y * step) * D.w + (x * step)] / 255;
            const inkOn = v >= bayer4(x, y);
            const i = (y * w + x) * 4;
            if (inkOn){ d[i] = 20; d[i + 1] = 18; d[i + 2] = 13; }
            else      { d[i] = 236; d[i + 1] = 234; d[i + 2] = 226; }
            d[i + 3] = 255;
        }
    }
    pipCx.putImageData(id, 0, 0);
    pip.classList.add('shown');
}

/* OCR: спільний прогін для авто-слота і SCN */
async function runOcr(imgData, kv, isScan){
    try {
        const res = await ocrWorker.recognize(imgData);
        const words = [];
        const src = (res && res.data && res.data.words) || [];
        for (const w of src){
            const txt = cleanText(w.text);
            if (!txt || w.confidence < CFG.ocrConf) continue;
            words.push({ text: txt, conf: w.confidence, x: w.bbox.x0, y: w.bbox.y0, w: w.bbox.x1 - w.bbox.x0, h: w.bbox.y1 - w.bbox.y0 });
        }
        const lines = groupLines(scaleWords(words, kv));
        const vis = ST.tracks.filter(t => t.hits >= 2);
        const at = attachText(vis, lines);
        const now = performance.now();
        const byId = {};
        for (const p of at.assigned) byId[p[0]] = byId[p[0]] ? byId[p[0]] + ' · ' + p[1] : p[1];
        for (const t of ST.tracks){
            if (byId[t.id]){ t.text = byId[t.id].slice(0, 42); t.textAt = now; }
        }
        ST.ocrFree = { lines: at.free, at: now };
        if (isScan) toast(lines.length ? ('ТЕКСТ Є: ' + lines.length + ' РЯДК.') : 'БУКВ НЕМА, ПУСТО');
    } catch (e) {
        if (isScan) toast('OCR СПІТКНУВСЯ', true);
    }
    MODS.OCR.busy = false;
    ST.scanning = false;
}

/* ── Цикл детекції: зважена ротація, один слот за тік, рендер не чекає ── */
function detectLoop(){
    if (!ST.running) return;
    setTimeout(detectLoop, 33);
    if (document.hidden || video.readyState < 2) return;
    const now = performance.now();
    const slots = Object.keys(MODS).map(k => {
        const m = MODS[k];
        return { key: k, on: m.on && m.ready, busy: m.busy, last: m.last, interval: m.interval };
    });
    const pick = nextSlot(now, slots);
    if (!pick) return;
    const M = MODS[pick];
    M.last = now;
    const g = grayLo(now);
    if (!g) return;
    const kv = (video.videoWidth || CFG.nnW) / g.w;
    try {
        if (pick === 'DET' && objDet){
            ingestDet(objDet.detectForVideo(g.cv, tsFor(objDet)), now, kv);
        } else if (pick === 'SEG' && segDet){
            ingestSeg(segDet.segmentForVideo(g.cv, tsFor(segDet)), now, g);
        } else if (pick === 'DEP' && depWorker){
            M.busy = true;
            const buf = g.id.data.slice();
            depWorker.postMessage({ type: 'frame', buf: buf.buffer, w: g.w, h: g.h }, [buf.buffer]);
        } else if (pick === 'OCR' && ocrWorker && !ST.scanning){
            M.busy = true;
            runOcr(g.id, kv, false);
        }
    } catch (e) {}
}

/* ── Оверлеї: чорнило на папері ── */
function plate(text, x, y, dpr, alpha, big){
    const fs = (big ? 11 : 10) * dpr;
    ctx.font = fs + "px 'Share Tech Mono'";
    const tw = ctx.measureText(text).width;
    const px = 4 * dpr, ph = fs + 6 * dpr;
    ctx.fillStyle = 'rgba(' + PAPER + ',' + (0.88 * alpha) + ')';
    ctx.fillRect(x - px, y - ph + 3 * dpr, tw + px * 2, ph);
    ctx.strokeStyle = 'rgba(' + INK + ',' + (0.4 * alpha) + ')';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - px, y - ph + 3 * dpr, tw + px * 2, ph);
    ctx.fillStyle = 'rgba(' + INK + ',' + (0.9 * alpha) + ')';
    ctx.fillText(text, x, y);
}
function drawTrack(t, now, dpr, T){
    const a = v2s(t.box.x, t.box.y, T), b = v2s(t.box.x + t.box.w, t.box.y + t.box.h, T);
    const rx = a.x * dpr, ry = a.y * dpr, rw = (b.x - a.x) * dpr, rh = (b.y - a.y) * dpr;
    const k = Math.min(1, t.hits / 6);
    ctx.strokeStyle = 'rgba(' + INK + ',' + (0.45 + 0.4 * k) + ')';
    ctx.lineWidth = 1.5 * dpr;
    const cL = Math.min(rw, rh) * 0.22;
    ctx.beginPath();
    ctx.moveTo(rx, ry + cL); ctx.lineTo(rx, ry); ctx.lineTo(rx + cL, ry);
    ctx.moveTo(rx + rw - cL, ry); ctx.lineTo(rx + rw, ry); ctx.lineTo(rx + rw, ry + cL);
    ctx.moveTo(rx + rw, ry + rh - cL); ctx.lineTo(rx + rw, ry + rh); ctx.lineTo(rx + rw - cL, ry + rh);
    ctx.moveTo(rx + cL, ry + rh); ctx.lineTo(rx, ry + rh); ctx.lineTo(rx, ry + rh - cL);
    ctx.stroke();
    let rng = -1;
    if (MODS.DEP.on && ST.depth && now - ST.depth.at < CFG.depTTL)
        rng = depthToRange(medianDepthInBox(ST.depth.data, ST.depth.w, ST.depth.h, t.box, video.videoWidth, video.videoHeight));
    let cov = 0;
    if (MODS.SEG.on && ST.mask && now - ST.mask.at < CFG.maskTTL)
        cov = segCoverage(ST.mask.data, ST.mask.w, ST.mask.h, t.box, video.videoWidth, video.videoHeight);
    let label = t.id + '·' + t.cls.toUpperCase();
    if (rng >= 0) label += '·R' + String(rng).padStart(2, '0');
    if (cov > 0.25) label += '·▦';
    plate(label, rx, ry - 6 * dpr, dpr, 1, false);
    if (t.text && now - t.textAt < CFG.textTTL)
        plate('› ' + t.text, rx, ry + rh + 16 * dpr, dpr, 1, false);
}

function draw(now){
    requestAnimationFrame(draw);
    if (document.hidden || !ST.running) return;
    if (now - lastGl >= 30){ GL.render(now); lastGl = now; }
    const dpr = hudDpr, W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const T = coverT();
    const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    if (MODS.SEG.on && ST.mask && now - ST.mask.at < CFG.maskTTL){
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(maskCv, T.ox * dpr, T.oy * dpr, vw * T.scale * dpr, vh * T.scale * dpr);
        ctx.restore();
    }
    for (const t of ST.tracks){
        if (t.hits < 2) continue;
        drawTrack(t, now, dpr, T);
    }
    if (ST.ocrFree && now - ST.ocrFree.at < CFG.freeTTL){
        const alpha = 1 - (now - ST.ocrFree.at) / CFG.freeTTL;
        for (const L of ST.ocrFree.lines){
            const p = v2s(L.x, L.y + L.h, T);
            plate(L.text.slice(0, 42), p.x * dpr, p.y * dpr, dpr, alpha, false);
        }
    }
}

/* ── BOOT ── */
startBtn.addEventListener('click', async () => {
    if (ST.booting) return;
    ST.booting = true;
    AU.init(); AU.monoSwap();
    startBtn.style.opacity = '0'; startBtn.style.transition = 'opacity 0.5s';
    setTimeout(() => startBtn.style.display = 'none', 500);
    try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 960 }, height: { ideal: 540 } }, audio: false });
        video.srcObject = s;
        await video.play().catch(() => {});
    } catch (e) {
        toast('КАМЕРИ НЕМА. ВСЬО, ПРИЇХАЛИ', true);
        return;
    }
    if (GL.init(glCanvas)){
        video.style.opacity = '0';
    } else {
        video.classList.add('rawfallback');
        toast('WEBGL ЗДОХ — ЇДЕМО НА CSS-ФІЛЬТРІ', true);
    }
    try { ST.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    botbar.style.display = 'flex';
    ST.running = true;
    resize();
    detectLoop();
    requestAnimationFrame(draw);
    toast('МОНОХРОМ ПРЕТ. ВРУБАЙ МОДУЛІ');
});

/* ── Керування ── */
MODS.DET.btn.addEventListener('click', () => toggleMod('DET'));
MODS.SEG.btn.addEventListener('click', () => toggleMod('SEG'));
MODS.DEP.btn.addEventListener('click', () => toggleMod('DEP'));
MODS.OCR.btn.addEventListener('click', () => toggleMod('OCR'));
scnBtn.addEventListener('click', () => {
    if (!MODS.OCR.ready || ST.scanning || MODS.OCR.busy) return;
    const g = grayHi();
    if (!g) return;
    ST.scanning = true;
    MODS.OCR.busy = true;
    toast('ЧИТАЮ КАДР, СЕКУНДУ..');
    runOcr(g.id, 1, true);
});
sndBtn.addEventListener('click', () => {
    const mute = AU.on;
    AU.setMute(mute);
    sndBtn.classList.toggle('off', mute);
});
pip.addEventListener('pointerdown', e => { e.stopPropagation(); pip.classList.toggle('big'); });
window.addEventListener('keydown', e => {
    if (!ST.running) return;
    const k = e.key;
    if (k === '1') toggleMod('DET');
    if (k === '2') toggleMod('SEG');
    if (k === '3') toggleMod('DEP');
    if (k === '4') toggleMod('OCR');
    if (k === '5') scnBtn.click();
    if (k.toLowerCase() === 'm' || k === 'ь') sndBtn.click();
});
document.addEventListener('visibilitychange', async () => {
    if (AU.ctx){ if (document.hidden) AU.ctx.suspend(); else if (AU.on) AU.ctx.resume(); }
    if (!document.hidden && ST.running){
        try { ST.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
});
window.addEventListener('resize', resize);
resize();
</script>
